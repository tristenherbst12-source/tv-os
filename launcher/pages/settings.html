<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings</title>
<link rel="preload" href="../fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../css/launcher.css">
<link rel="stylesheet" href="../css/pages.css">
</head>
<body>
<div class="wall"><div class="blob a"></div><div class="blob b"></div><div class="blob c"></div><div class="blob d"></div></div>
<div class="vignette"></div>

<main class="screen">
  <header class="page-head">
    <div class="page-title">Settings</div>
    <div class="status">
      <div class="pill test" id="testPill" hidden>Test Mode</div>
      <div class="pill"><span class="clock-small" id="clock">--:--</span></div>
    </div>
  </header>

  <section class="list" id="list"></section>

  <div class="hints">
    <span><span class="key">▲ ▼</span>Move</span>
    <span><span class="key">◀ ▶</span>Change</span>
    <span><span class="key">OK</span>Select</span>
    <span><span class="key">Back</span>Home</span>
  </div>
</main>

<script src="../js/helper-token.js"></script>
<script src="../js/defaults.js"></script>
<script src="../js/glyphs.js"></script>
<script src="../js/themes.js"></script>
<script src="../js/wallpaper.js"></script>
<script src="../js/config.js"></script>
<script src="../js/keys.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/vendor/qrcode.js"></script>
<script src="../js/speedtest.js"></script>
<script src="../js/settings.js"></script>
</body>
</html>
